<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gorilla Tag Fan Game - V4</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: #87CEEB;
    }

    #info {
        position: absolute;
        top: 12px;
        left: 12px;
        padding: 12px;
        color: white;
        background: rgba(0,0,0,0.7);
        border-radius: 10px;
        z-index: 5;
        pointer-events: none;
    }

    #info h2 { margin: 0 0 8px; }
    #info p { margin: 4px 0; }
</style>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>
</head>

<body>

<div id="info">
    <h2>GORILLA TAG FAN GAME V4</h2>
    <p>VR: Press Enter VR</p>
    <p>Movement: Push against surfaces with your hands</p>
    <p>Desktop: WASD + Mouse</p>
    <p>Physics: Updated</p>
</div>

<script type="module">

import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';

// ==========================================
// SETTINGS
// ==========================================

const SETTINGS = {
    handRadius: 0.12,
    handReach: 1.15,
    gravity: 9.81,
    maxVelocity: 9,
    groundFriction: 0.98,
    airFriction: 0.995
};

// ==========================================
// SCENE
// ==========================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87CEEB);

scene.fog = new THREE.Fog(
    0x87CEEB,
    35,
    110
);

// ==========================================
// PLAYER RIG
// ==========================================

const rig = new THREE.Group();

scene.add(rig);

rig.position.set(0, 0, 0);

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

// Desktop camera height.
// This will be set to zero while in VR.
camera.position.set(0, 1.6, 0);

rig.add(camera);

// ==========================================
// PHYSICS
// ==========================================

const velocity = new THREE.Vector3();

let onGround = false;

// ==========================================
// RENDERER
// ==========================================

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 1.5)
);

renderer.xr.enabled = true;

// Use a floor-level coordinate system in VR.
renderer.xr.setReferenceSpaceType('local-floor');

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

renderer.outputColorSpace = THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);

document.body.appendChild(
    VRButton.createButton(renderer)
);

// ==========================================
// LIGHTING
// ==========================================

const ambient = new THREE.HemisphereLight(
    0xffffff,
    0x557755,
    2
);

scene.add(ambient);

const sun = new THREE.DirectionalLight(
    0xffffff,
    2
);

sun.position.set(10, 20, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);

scene.add(sun);

// ==========================================
// GROUND
// ==========================================

const ground = new THREE.Mesh(
    new THREE.BoxGeometry(100, 1, 100),
    new THREE.MeshStandardMaterial({
        color: 0x42a542,
        roughness: 1
    })
);

ground.position.y = -0.5;
ground.receiveShadow = true;

scene.add(ground);

const grid = new THREE.GridHelper(
    100,
    100,
    0x225522,
    0x669966
);

grid.position.y = 0.005;
scene.add(grid);

// ==========================================
// COLLIDABLE OBJECTS
// ==========================================

const colliders = [];

function createCube(x, y, z, color, size) {

    const cube = new THREE.Mesh(
        new THREE.BoxGeometry(size, size, size),
        new THREE.MeshStandardMaterial({
            color,
            roughness: 0.8
        })
    );

    cube.position.set(x, y, z);
    cube.castShadow = true;
    cube.receiveShadow = true;

    scene.add(cube);

    colliders.push({
        min: new THREE.Vector3(
            x - size / 2,
            y - size / 2,
            z - size / 2
        ),
        max: new THREE.Vector3(
            x + size / 2,
            y + size / 2,
            z + size / 2
        )
    });
}

createCube(5, 1, -5, 0xff0000, 2);
createCube(-5, 1, -5, 0x0000ff, 2);
createCube(5, 1, 5, 0xffff00, 2);
createCube(-5, 1, 5, 0xff00ff, 2);

// ==========================================
// VR CONTROLLERS
// ==========================================

const controllers = [];
const handMeshes = [];
const handMaterials = [];

const handAnchors = [null, null];

for (let i = 0; i < 2; i++) {

    const controller = renderer.xr.getController(i);

    // Controllers and camera share the same rig.
    rig.add(controller);

    controllers.push(controller);

    const hand = new THREE.Mesh(
        new THREE.SphereGeometry(
            SETTINGS.handRadius,
            16,
            16
        ),
        new THREE.MeshStandardMaterial({
            color: i === 0 ? 0xffbb55 : 0xff8855
        })
    );

    hand.castShadow = true;

    controller.add(hand);

    handMeshes.push(hand);
    handMaterials.push(hand.material);
}

// ==========================================
// HAND STATE
// ==========================================

function setHandAnchored(index, anchored) {

    handMaterials[index].color.set(
        anchored
            ? 0x55ff55
            : index === 0
                ? 0xffbb55
                : 0xff8855
    );

}

// ==========================================
// COLLISION DETECTION
// ==========================================

function getHandCollision(position) {

    const radius = SETTINGS.handRadius;

    // Ground collision.
    if (
        position.y <= radius &&
        Math.abs(position.x) < 49.5 &&
        Math.abs(position.z) < 49.5
    ) {

        return new THREE.Vector3(
            position.x,
            radius,
            position.z
        );

    }

    // Cube collision.
    for (const box of colliders) {

        const closest = new THREE.Vector3(
            THREE.MathUtils.clamp(
                position.x,
                box.min.x,
                box.max.x
            ),
            THREE.MathUtils.clamp(
                position.y,
                box.min.y,
                box.max.y
            ),
            THREE.MathUtils.clamp(
                position.z,
                box.min.z,
                box.max.z
            )
        );

        const difference = new THREE.Vector3()
            .subVectors(position, closest);

        const distance = difference.length();

        if (distance >= radius) continue;

        // Outside the box.
        if (distance > 0.0001) {

            return closest.addScaledVector(
                difference.normalize(),
                radius
            );

        }

        // Inside the box: find the nearest face.
        const distances = [
            position.x - box.min.x,
            box.max.x - position.x,
            position.y - box.min.y,
            box.max.y - position.y,
            position.z - box.min.z,
            box.max.z - position.z
        ];

        const smallest = Math.min(...distances);

        const normal = new THREE.Vector3();
        const surface = position.clone();

        if (smallest === distances[0]) {
            normal.set(-1, 0, 0);
            surface.x = box.min.x;
        } else if (smallest === distances[1]) {
            normal.set(1, 0, 0);
            surface.x = box.max.x;
        } else if (smallest === distances[2]) {
            normal.set(0, -1, 0);
            surface.y = box.min.y;
        } else if (smallest === distances[3]) {
            normal.set(0, 1, 0);
            surface.y = box.max.y;
        } else if (smallest === distances[4]) {
            normal.set(0, 0, -1);
            surface.z = box.min.z;
        } else {
            normal.set(0, 0, 1);
            surface.z = box.max.z;
        }

        return surface.addScaledVector(
            normal,
            radius
        );
    }

    return null;
}

// ==========================================
// HAND LOCOMOTION
// ==========================================

const handPositions = [
    new THREE.Vector3(),
    new THREE.Vector3()
];

const totalCorrection = new THREE.Vector3();

const correction = new THREE.Vector3();

function updateHands(deltaTime) {

    totalCorrection.set(0, 0, 0);

    let anchoredCount = 0;

    // Make sure world positions are current.
    scene.updateMatrixWorld(true);

    for (let i = 0; i < 2; i++) {

        const controller = controllers[i];
        const handPosition = handPositions[i];

        controller.getWorldPosition(handPosition);

        // ----------------------------------
        // EXISTING ANCHOR
        // ----------------------------------

        if (handAnchors[i] !== null) {

            const distance = handPosition.distanceTo(
                handAnchors[i]
            );

            if (distance > SETTINGS.handReach) {

                handAnchors[i] = null;

                setHandAnchored(i, false);

            } else {

                correction.subVectors(
                    handAnchors[i],
                    handPosition
                );

                totalCorrection.add(correction);

                anchoredCount++;

            }
        }

        // ----------------------------------
        // NEW COLLISION
        // ----------------------------------

        if (handAnchors[i] === null) {

            const collision = getHandCollision(
                handPosition
            );

            if (collision !== null) {

                handAnchors[i] = collision.clone();

                setHandAnchored(i, true);

                correction.subVectors(
                    collision,
                    handPosition
                );

                totalCorrection.add(correction);

                anchoredCount++;

            }
        }
    }

    // --------------------------------------
    // APPLY MOVEMENT
    // --------------------------------------

    if (anchoredCount > 0) {

        totalCorrection.divideScalar(anchoredCount);

        // Move the rig opposite to the hand movement.
        rig.position.add(totalCorrection);

        // Calculate velocity from actual movement.
        const movementVelocity = totalCorrection.clone()
            .divideScalar(Math.max(deltaTime, 0.001));

        if (movementVelocity.length() > SETTINGS.maxVelocity) {
            movementVelocity.setLength(SETTINGS.maxVelocity);
        }

        velocity.copy(movementVelocity);

    }

}

// ==========================================
// GRAVITY AND PLAYER PHYSICS
// ==========================================

function updateGravity(deltaTime) {

    // Gravity.
    velocity.y -= SETTINGS.gravity * deltaTime;

    // Move the player.
    rig.position.addScaledVector(
        velocity,
        deltaTime
    );

    // Ground collision.
    if (rig.position.y < 0) {

        rig.position.y = 0;

        if (velocity.y < 0) {
            velocity.y = 0;
        }

        onGround = true;

    } else {

        onGround = false;

    }

    // Friction.
    const friction = onGround
        ? SETTINGS.groundFriction
        : SETTINGS.airFriction;

    velocity.x *= Math.pow(friction, deltaTime * 60);
    velocity.z *= Math.pow(friction, deltaTime * 60);
}

// ==========================================
// DESKTOP CONTROLS
// ==========================================

const keys = {};

document.addEventListener('keydown', event => {
    keys[event.code] = true;
});

document.addEventListener('keyup', event => {
    keys[event.code] = false;
});

let mouseDown = false;

document.addEventListener('mousedown', () => {
    if (!renderer.xr.isPresenting) {
        mouseDown = true;
    }
});

document.addEventListener('mouseup', () => {
    mouseDown = false;
});

document.addEventListener('mousemove', event => {

    if (!mouseDown || renderer.xr.isPresenting) return;

    camera.rotation.order = 'YXZ';

    camera.rotation.y -= event.movementX * 0.002;
    camera.rotation.x -= event.movementY * 0.002;

    camera.rotation.x = THREE.MathUtils.clamp(
        camera.rotation.x,
        -1.5,
        1.5
    );
});

function updateDesktop(deltaTime) {

    const direction = new THREE.Vector3();

    camera.getWorldDirection(direction);

    direction.y = 0;
    direction.normalize();

    const right = new THREE.Vector3()
        .crossVectors(
            direction,
            new THREE.Vector3(0, 1, 0)
        )
        .normalize();

    const speed = 5 * deltaTime;

    if (keys['KeyW']) {
        rig.position.addScaledVector(direction, speed);
    }

    if (keys['KeyS']) {
        rig.position.addScaledVector(direction, -speed);
    }

    if (keys['KeyA']) {
        rig.position.addScaledVector(right, -speed);
    }

    if (keys['KeyD']) {
        rig.position.addScaledVector(right, speed);
    }
}

// ==========================================
// VR SESSION EVENTS
// ==========================================

renderer.xr.addEventListener('sessionstart', () => {

    // Critical: the XR camera already receives its
    // height from the headset's floor-level tracking.

    camera.position.set(0, 0, 0);

    rig.position.set(0, 0, 0);

    velocity.set(0, 0, 0);

    handAnchors[0] = null;
    handAnchors[1] = null;

    setHandAnchored(0, false);
    setHandAnchored(1, false);

});

renderer.xr.addEventListener('sessionend', () => {

    camera.position.set(0, 1.6, 0);

    velocity.set(0, 0, 0);

    handAnchors[0] = null;
    handAnchors[1] = null;

    setHandAnchored(0, false);
    setHandAnchored(1, false);

});

// ==========================================
// RESIZE
// ==========================================

window.addEventListener('resize', () => {

    camera.aspect =
        window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

});

// ==========================================
// MAIN LOOP
// ==========================================

const clock = new THREE.Clock();

function animate() {

    const deltaTime = Math.min(
        clock.getDelta(),
        0.033
    );

    if (renderer.xr.isPresenting) {

        updateGravity(deltaTime);

        updateHands(deltaTime);

    } else {

        updateDesktop(deltaTime);

    }

    renderer.render(scene, camera);

}

renderer.setAnimationLoop(animate);

</script>

</body>
</html>
