<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gorilla Tag Fan Game - V2</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: #87CEEB;
    }

    #info {
        position: absolute;
        top: 12px;
        left: 12px;
        padding: 12px;
        color: white;
        background: rgba(0,0,0,0.7);
        border-radius: 10px;
        z-index: 5;
        pointer-events: none;
    }

    #info h2 {
        margin: 0 0 8px;
    }

    #info p {
        margin: 4px 0;
    }
</style>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>
</head>

<body>

<div id="info">
    <h2>GORILLA TAG FAN GAME V2</h2>
    <p>VR: Press Enter VR</p>
    <p>Movement: Push against surfaces with your hands</p>
    <p>Desktop: WASD + Mouse</p>
    <p>Physics: ENABLED</p>
</div>

<script type="module">

import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';

// ==========================================
// SETTINGS
// ==========================================

const SETTINGS = {

    handRadius: 0.11,

    gravity: 9.81,

    maxVelocity: 9,

    handReach: 0.65,

    groundFriction: 0.98,

    airFriction: 0.995

};

// ==========================================
// SCENE
// ==========================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87CEEB);

scene.fog = new THREE.Fog(
    0x87CEEB,
    35,
    110
);

// ==========================================
// PLAYER
// ==========================================

const player = new THREE.Group();

scene.add(player);

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

player.position.set(0, 0, 0);
camera.position.set(0, 1.6, 0);
    
player.add(camera);

// Player physics

const velocity = new THREE.Vector3();

let onGround = false;

const PLAYER_HEIGHT = 1.6;
const PLAYER_RADIUS = 0.25;

player.position.set(0, 0, 0);
camera.position.set(0, PLAYER_HEIGHT, 0);
    
// ==========================================
// RENDERER
// ==========================================

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 1.5)
);

renderer.xr.enabled = true;

renderer.shadowMap.enabled = true;

renderer.shadowMap.type = THREE.PCFSoftShadowMap;

renderer.outputColorSpace = THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);

document.body.appendChild(
    VRButton.createButton(renderer)
);

// ==========================================
// LIGHTING
// ==========================================

const ambient = new THREE.HemisphereLight(
    0xffffff,
    0x557755,
    2
);

scene.add(ambient);

const sun = new THREE.DirectionalLight(
    0xffffff,
    2
);

sun.position.set(10, 20, 10);

sun.castShadow = true;

sun.shadow.mapSize.set(1024, 1024);

scene.add(sun);

// ==========================================
// BASEPLATE
// ==========================================

const groundGeometry = new THREE.BoxGeometry(
    100,
    1,
    100
);

const groundMaterial = new THREE.MeshStandardMaterial({
    color: 0x42a542,
    roughness: 1
});

const ground = new THREE.Mesh(
    groundGeometry,
    groundMaterial
);

ground.position.y = -0.5;

ground.receiveShadow = true;

scene.add(ground);

const grid = new THREE.GridHelper(
    100,
    100,
    0x225522,
    0x669966
);

grid.position.y = 0.005;

scene.add(grid);

// ==========================================
// PHYSICAL OBJECTS
// ==========================================

const colliders = [];

function createCube(x, y, z, color, size) {

    const geometry = new THREE.BoxGeometry(
        size,
        size,
        size
    );

    const material = new THREE.MeshStandardMaterial({
        color: color,
        roughness: 0.8
    });

    const cube = new THREE.Mesh(
        geometry,
        material
    );

    cube.position.set(x, y, z);

    cube.castShadow = true;

    cube.receiveShadow = true;

    scene.add(cube);

    colliders.push({
        min: new THREE.Vector3(
            x - size / 2,
            y - size / 2,
            z - size / 2
        ),

        max: new THREE.Vector3(
            x + size / 2,
            y + size / 2,
            z + size / 2
        )
    });

}

createCube(5, 1, -5, 0xff0000, 2);

createCube(-5, 1, -5, 0x0000ff, 2);

createCube(5, 1, 5, 0xffff00, 2);

createCube(-5, 1, 5, 0xff00ff, 2);

// ==========================================
// CONTROLLERS
// ==========================================

const controllers = [];

const handAnchors = [null, null];

const handMeshes = [];

for (let i = 0; i < 2; i++) {

    const controller = renderer.xr.getController(i);

    // Controllers must follow the player rig.

    player.add(controller);

    controllers.push(controller);

    const geometry = new THREE.SphereGeometry(
        SETTINGS.handRadius,
        16,
        16
    );

    const material = new THREE.MeshStandardMaterial({
        color: i === 0 ? 0xffbb55 : 0xff8855
    });

    const hand = new THREE.Mesh(
        geometry,
        material
    );

    controller.add(hand);

    handMeshes.push(hand);

}

// ==========================================
// COLLISION DETECTION
// ==========================================

const tempVector = new THREE.Vector3();

function getHandCollision(position) {

    const radius = SETTINGS.handRadius;

    // Ground collision

    if (
        position.y < radius &&
        Math.abs(position.x) < 49.5 &&
        Math.abs(position.z) < 49.5
    ) {

        return new THREE.Vector3(
            position.x,
            radius,
            position.z
        );

    }

    // Cube collisions

    for (const box of colliders) {

        const closest = new THREE.Vector3(
            THREE.MathUtils.clamp(
                position.x,
                box.min.x,
                box.max.x
            ),

            THREE.MathUtils.clamp(
                position.y,
                box.min.y,
                box.max.y
            ),

            THREE.MathUtils.clamp(
                position.z,
                box.min.z,
                box.max.z
            )
        );

        const distance = position.distanceTo(closest);

        if (distance < radius) {

            const normal = new THREE.Vector3();

            if (distance > 0.0001) {

                normal.subVectors(
                    position,
                    closest
                ).normalize();

            } else {

                // Hand is inside the box.
                // Find the closest face.

                const distances = [
                    position.x - box.min.x,
                    box.max.x - position.x,
                    position.y - box.min.y,
                    box.max.y - position.y,
                    position.z - box.min.z,
                    box.max.z - position.z
                ];

                const smallest = Math.min(...distances);

                if (smallest === distances[0]) normal.set(-1,0,0);
                else if (smallest === distances[1]) normal.set(1,0,0);
                else if (smallest === distances[2]) normal.set(0,-1,0);
                else if (smallest === distances[3]) normal.set(0,1,0);
                else if (smallest === distances[4]) normal.set(0,0,-1);
                else normal.set(0,0,1);

                return closest.addScaledVector(
                    normal,
                    radius
                );

            }

            return closest.addScaledVector(
                normal,
                radius
            );

        }

    }

    return null;

}

// ==========================================
// GORILLA TAG STYLE HAND PHYSICS
// ==========================================

function updateHands(deltaTime) {

    for (let i = 0; i < 2; i++) {

        const controller = controllers[i];

        const handPosition = new THREE.Vector3();

        controller.getWorldPosition(handPosition);

        // ==================================
        // EXISTING HAND ANCHOR
        // ==================================

        if (handAnchors[i] !== null) {

            const distance = handPosition.distanceTo(
                handAnchors[i]
            );

            // Release if the arm stretches too far.

            if (distance > SETTINGS.handReach) {

                handAnchors[i] = null;

            } else {

                // Move player opposite to hand movement.

                const movement = new THREE.Vector3()
                    .subVectors(
                        handAnchors[i],
                        handPosition
                    );

                player.position.add(movement);

                // Generate physical momentum.

                velocity.addScaledVector(
                    movement,
                    1 / Math.max(deltaTime, 0.001)
                );

                // Limit maximum velocity.

                if (
                    velocity.length() >
                    SETTINGS.maxVelocity
                ) {

                    velocity.setLength(
                        SETTINGS.maxVelocity
                    );

                }

            }

        }

        // ==================================
        // NEW HAND COLLISION
        // ==================================

        if (handAnchors[i] === null) {

            const collision = getHandCollision(
                handPosition
            );

            if (collision !== null) {

                handAnchors[i] = collision;

            }

        }

    }

}

// ==========================================
// PLAYER GRAVITY
// ==========================================

function updateGravity(deltaTime) {

    const gravity = 9.81;

    // Apply gravity
    velocity.y -= gravity * deltaTime;

    // Apply velocity
    player.position.addScaledVector(
        velocity,
        deltaTime
    );

    // Ground collision
    const groundHeight = 0;

    if (player.position.y < groundHeight) {

        player.position.y = groundHeight;

        if (velocity.y < 0) {
            velocity.y = 0;
        }

        onGround = true;

    } else {

        onGround = false;

    }

    // Air resistance
    const friction = onGround ? 0.98 : 0.995;

    velocity.x *= Math.pow(friction, deltaTime * 60);
    velocity.z *= Math.pow(friction, deltaTime * 60);

}
    
// ==========================================
// DESKTOP CONTROLS
// ==========================================

const keys = {};

document.addEventListener('keydown', event => {
    keys[event.code] = true;
});

document.addEventListener('keyup', event => {
    keys[event.code] = false;
});

let mouseDown = false;

document.addEventListener('mousedown', () => {

    if (!renderer.xr.isPresenting) {
        mouseDown = true;
    }

});

document.addEventListener('mouseup', () => {
    mouseDown = false;
});

document.addEventListener('mousemove', event => {

    if (!mouseDown || renderer.xr.isPresenting) return;

    camera.rotation.order = 'YXZ';

    camera.rotation.y -= event.movementX * 0.002;

    camera.rotation.x -= event.movementY * 0.002;

    camera.rotation.x = THREE.MathUtils.clamp(
        camera.rotation.x,
        -1.5,
        1.5
    );

});

function updateDesktop(deltaTime) {

    if (renderer.xr.isPresenting) return;

    const direction = new THREE.Vector3();

    camera.getWorldDirection(direction);

    direction.y = 0;

    direction.normalize();

    const right = new THREE.Vector3()
        .crossVectors(
            direction,
            new THREE.Vector3(0, 1, 0)
        )
        .normalize();

    const speed = 5 * deltaTime;

    if (keys['KeyW']) {
        player.position.addScaledVector(direction, speed);
    }

    if (keys['KeyS']) {
        player.position.addScaledVector(direction, -speed);
    }

    if (keys['KeyA']) {
        player.position.addScaledVector(right, -speed);
    }

    if (keys['KeyD']) {
        player.position.addScaledVector(right, speed);
    }

}

// ==========================================
// RESET HANDS WHEN EXITING VR
// ==========================================

renderer.xr.addEventListener(
    'sessionend',
    () => {

        handAnchors[0] = null;

        handAnchors[1] = null;

        velocity.set(0, 0, 0);

    }
);

// ==========================================
// RESIZING
// ==========================================

window.addEventListener('resize', () => {

    camera.aspect =
        window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

});

// ==========================================
// MAIN GAME LOOP
// ==========================================

const clock = new THREE.Clock();

function animate() {

    const deltaTime = Math.min(
        clock.getDelta(),
        0.033
    );

    if (renderer.xr.isPresenting) {

        updateGravity(deltaTime);

        updateHands(deltaTime);

    } else {

        updateDesktop(deltaTime);

    }

    renderer.render(
        scene,
        camera
    );

}

renderer.setAnimationLoop(animate);

</script>

</body>
</html>
