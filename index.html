<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gorilla Tag Fan Game</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #87CEEB;

        #info {
            position: absolute;

            margin: 4px 0;

    <script type="importmap">

        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

</head>

<body>

<div id="info">
    <h2>GORILLA TAG FAN GAME</h2>
    <p>Quest: Press the VR button to enter VR.</p>
    <p>Locomotion: Hold a controller trigger and move your hand.</p>
    <p>Desktop: WASD to move, mouse to look.</p>
</div>

<script type="module">

import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';

// =====================================
// SCENE
// =====================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87CEEB);

scene.fog = new THREE.Fog(
    0x87CEEB,
    30,
    100
);

// =====================================
// CAMERA
// =====================================

const player = new THREE.Group();

scene.add(player);

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(0, 1.6, 0);

player.add(camera);

// =====================================
// RENDERER
// =====================================

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.xr.enabled = true;

renderer.shadowMap.enabled = true;

renderer.shadowMap.type = THREE.PCFSoftShadowMap;

document.body.appendChild(renderer.domElement);

// VR BUTTON

document.body.appendChild(
    VRButton.createButton(renderer)
);

// =====================================
// LIGHTING
// =====================================

const ambientLight = new THREE.HemisphereLight(
    0xffffff,
    0x557755,
    2
);

scene.add(ambientLight);

const sunlight = new THREE.DirectionalLight(
    0xffffff,
    2
);

sunlight.position.set(10, 20, 10);

sunlight.castShadow = true;

sunlight.shadow.mapSize.width = 2048;
sunlight.shadow.mapSize.height = 2048;

scene.add(sunlight);

// =====================================
// BASEPLATE
// =====================================

const groundGeometry = new THREE.BoxGeometry(
    100,
    1,
    100
);

const groundMaterial = new THREE.MeshStandardMaterial({
    color: 0x42a542,
    roughness: 1
});

const ground = new THREE.Mesh(
    groundGeometry,
    groundMaterial
);

ground.position.y = -0.5;

ground.receiveShadow = true;

scene.add(ground);

// =====================================
// BASEPLATE GRID
// =====================================

const grid = new THREE.GridHelper(
    100,
    100,
    0x225522,
    0x669966
);

grid.position.y = 0.01;

scene.add(grid);

// =====================================
// TEST OBJECTS
// =====================================

function createCube(x, y, z, color, size) {

    const geometry = new THREE.BoxGeometry(
        size,
        size,
        size
    );

    const material = new THREE.MeshStandardMaterial({
        color: color
    });

    const cube = new THREE.Mesh(
        geometry,
        material
    );

    cube.position.set(x, y, z);

    cube.castShadow = true;
    cube.receiveShadow = true;

    scene.add(cube);
}

// A few cubes around the baseplate

createCube(5, 1, -5, 0xff0000, 2);
createCube(-5, 1, -5, 0x0000ff, 2);
createCube(5, 1, 5, 0xffff00, 2);
createCube(-5, 1, 5, 0xff00ff, 2);

// =====================================
// CONTROLLERS
// =====================================

const controllers = [];

const previousPositions = [];

const triggerHeld = [false, false];

const handMeshes = [];

for (let i = 0; i < 2; i++) {

    const controller = renderer.xr.getController(i);

    scene.add(controller);

    controllers.push(controller);

    previousPositions.push(
        new THREE.Vector3()
    );

    // Simple visual hand

    const handGeometry = new THREE.SphereGeometry(
        0.09,
        16,
        16
    );

    const handMaterial = new THREE.MeshStandardMaterial({
        color: i === 0 ? 0xffcc66 : 0xff9966
    });

    const hand = new THREE.Mesh(
        handGeometry,
        handMaterial
    );

    controller.add(hand);

    handMeshes.push(hand);

    controller.addEventListener(
        'selectstart',
        () => {

            triggerHeld[i] = true;

            controller.getWorldPosition(
                previousPositions[i]
            );

        }
    );

    controller.addEventListener(
        'selectend',
        () => {

            triggerHeld[i] = false;

        }
    );
}

// =====================================
// GORILLA-STYLE LOCOMOTION
// =====================================

const movementSpeed = 1.4;

function updateLocomotion() {

    for (let i = 0; i < controllers.length; i++) {

        if (!triggerHeld[i]) continue;

        const currentPosition = new THREE.Vector3();

        controllers[i].getWorldPosition(
            currentPosition
        );

        const movement = new THREE.Vector3()
            .subVectors(
                currentPosition,
                previousPositions[i]
            );

        // Move the player opposite to hand movement

        player.position.x -= movement.x * movementSpeed;
        player.position.z -= movement.z * movementSpeed;

        // Prevent unintended vertical movement
        // in this first prototype.

        previousPositions[i].copy(currentPosition);

    }

}

// =====================================
// DESKTOP CONTROLS
// =====================================

const keys = {};

document.addEventListener('keydown', (event) => {
    keys[event.code] = true;
});

document.addEventListener('keyup', (event) => {
    keys[event.code] = false;
});

let mouseDown = false;

let mouseX = 0;
let mouseY = 0;

document.addEventListener('mousedown', () => {
    if (!renderer.xr.isPresenting) {
        mouseDown = true;
    }
});

document.addEventListener('mouseup', () => {
    mouseDown = false;
});

document.addEventListener('mousemove', (event) => {

    if (!mouseDown || renderer.xr.isPresenting) return;

    camera.rotation.order = 'YXZ';

    camera.rotation.y -= event.movementX * 0.002;

    camera.rotation.x -= event.movementY * 0.002;

    camera.rotation.x = THREE.MathUtils.clamp(
        camera.rotation.x,
        -Math.PI / 2,
        Math.PI / 2
    );

});

function updateDesktopMovement() {

    if (renderer.xr.isPresenting) return;

    const direction = new THREE.Vector3();

    camera.getWorldDirection(direction);

    direction.y = 0;

    direction.normalize();

    const right = new THREE.Vector3()
        .crossVectors(
            direction,
            new THREE.Vector3(0, 1, 0)
        )
        .normalize();

    const speed = 0.12;

    if (keys['KeyW']) {
        player.position.addScaledVector(direction, speed);
    }

    if (keys['KeyS']) {
        player.position.addScaledVector(direction, -speed);
    }

    if (keys['KeyA']) {
        player.position.addScaledVector(right, -speed);
    }

    if (keys['KeyD']) {
        player.position.addScaledVector(right, speed);
    }

}

// =====================================
// WINDOW RESIZING
// =====================================

window.addEventListener('resize', () => {

    camera.aspect =
        window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

});

// =====================================
// GAME LOOP
// =====================================

function animate() {

    updateLocomotion();

    updateDesktopMovement();

    renderer.render(scene, camera);

}

renderer.setAnimationLoop(animate);

</script>

</body>
</html>
